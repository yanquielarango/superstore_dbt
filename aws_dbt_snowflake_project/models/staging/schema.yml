models:
  - name: stg_orders
    description: "Staging model for orders. Cleans and standardizes raw order data including date format conversion from DD.MM.YYYY to DATE and decimal normalization from comma to dot notation."
    columns:
      - name: order_id
        description: "Order identifier. Not unique at this grain as a single order can contain multiple products."
        tests:
          - not_null
      - name: order_date
        description: "Date the order was placed. Converted from DD.MM.YYYY string format to native DATE type."
        tests:
          - not_null
      - name: ship_date
        description: "Date the order was shipped. Converted from DD.MM.YYYY string format to native DATE type."
        tests:
          - not_null
      - name: ship_mode
        description: "Shipping method selected for the order. Values include Standard Class, Second Class, First Class, and Same Day."
      - name: customer_id
        description: "Foreign key to the customers dimension. References stg_customers.customer_id."
        tests:
          - not_null
      - name: segment
        description: "Customer market segment. Values include Consumer, Corporate, and Home Office."
      - name: postal_code
        description: "Postal code of the delivery address. Used to join with the locations dimension."
        tests:
          - not_null
      - name: product_id
        description: "Foreign key to the products dimension. References stg_products.product_id."
        tests:
          - not_null
      - name: sales
        description: "Total sales amount in USD for the line item. Converted from comma decimal notation to dot notation."
        tests:
          - not_null
      - name: quantity
        description: "Number of units ordered for the line item."
      - name: discount
        description: "Discount rate applied to the line item. Expressed as a decimal between 0 and 1."
      - name: profit
        description: "Profit amount in USD for the line item. Can be negative for discounted or returned orders."
      - name: created_at
        description: "Timestamp when the record was loaded into the RAW layer."

  - name: stg_customers
    description: "Staging model for customers. Provides a clean and deduplicated customer list from the RAW layer."
    columns:
      - name: customer_id
        description: "Primary key. Unique identifier for each customer."
        tests:
          - not_null
          - unique
      - name: customer_sk
        description: "Surrogate key generated by Snowflake autoincrement. Used as the primary key in the analytics dimension."
      - name: customer_name
        description: "Full name of the customer."
        tests:
          - not_null
      - name: created_at
        description: "Timestamp when the record was loaded into the RAW layer."

  - name: stg_products
    description: "Staging model for products. Note: the source data contains duplicate product_id values with different product names, indicating a data quality issue in the source system."
    columns:
      - name: product_id
        description: "Natural key for the product. Not guaranteed to be unique due to data quality issues in the source CSV."
        tests:
          - not_null
          - unique:
              config:
                severity: warn
      - name: product_sk
        description: "Surrogate key generated by Snowflake autoincrement. Used as the primary key in the analytics dimension."
      - name: category
        description: "Top-level product category."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Furniture', 'Office Supplies', 'Technology']
      - name: sub_category
        description: "Product sub-category within the main category."
      - name: product_name
        description: "Full descriptive name of the product."
      - name: created_at
        description: "Timestamp when the record was loaded into the RAW layer."

  - name: stg_locations
    description: "Staging model for locations. Contains geographic data including city, state, region, and country. One record has a null postal code due to a data quality issue in the source."
    columns:
      - name: location_sk
        description: "Surrogate key generated by Snowflake autoincrement. Primary key for the locations dimension."
        tests:
          - not_null
          - unique
      - name: postal_code
        description: "Postal code of the location. Used to join with the orders fact table. One null value exists in the source data."
        tests:
          - not_null:
              config:
                severity: warn
      - name: city
        description: "City name of the location."
      - name: state
        description: "State or province of the location."
      - name: region
        description: "Sales region. Values include West, East, Central, and South."
      - name: country
        description: "Country of the location."
      - name: created_at
        description: "Timestamp when the record was loaded into the RAW layer."